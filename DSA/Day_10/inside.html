<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seed placement</title>

<style>
:root{
    --void:#080C1A;
    --screen:#0A1026;
    --line:#26315E;
    --ice:#DCE4FF;
    --dim:#8593C4;
    --accent:#FFB067;
    --leaf:#7BE8B0;
    --warn:#FF8A7A;

    --display:"Bahnschrift","Segoe UI Semibold","Helvetica Neue",Impact,sans-serif;
    --body:"Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
}

*{box-sizing:border-box}

html,body{height:100%;overflow:hidden}

body{
    margin:0;
    background:
        radial-gradient(120% 90% at 50% 0%,rgba(150,169,255,.12),transparent 60%),
        var(--screen);
    color:var(--ice);
    font-family:var(--body);
    display:flex;
    flex-direction:column;
    padding:20px clamp(18px,3.5vw,30px);
    position:relative;
}

body::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(220,228,255,.03) 0 1px,transparent 1px 3px);
}

.bar-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--dim);
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
}

.bar-top b{color:var(--leaf);font-weight:400}
.bar-top .n{color:var(--ice);font-variant-numeric:tabular-nums}

.stage{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:clamp(18px,3vw,38px);
    align-items:stretch;
    padding:16px 0;
}

.plate{
    position:relative;
    height:100%;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

canvas{display:block;max-width:100%;max-height:100%}

/* controls */

.dial{min-width:0;align-self:center}

.turn{
    font-family:var(--display);
    font-stretch:condensed;
    font-weight:700;
    font-size:clamp(3rem,7.5vw,5.4rem);
    line-height:.85;
    letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
    color:var(--accent);
    text-shadow:0 0 34px rgba(255,176,103,.32);
    transition:color .3s ease,text-shadow .3s ease;
    margin:0;
}

.turn small{font-size:.42em;vertical-align:super;letter-spacing:0}

.verdict{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
    margin:10px 0 0;
    color:var(--warn);
    transition:color .3s ease;
}

.verdict.locked{color:var(--leaf)}

input[type=range]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:34px;
    margin:22px 0 0;
    background:transparent;
    cursor:ew-resize;
}

input[type=range]::-webkit-slider-runnable-track{
    height:2px;
    background:linear-gradient(90deg,var(--line),var(--accent),var(--line));
}

input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px;height:26px;
    margin-top:-12px;
    border-radius:2px;
    background:var(--accent);
    box-shadow:0 0 18px rgba(255,176,103,.6);
}

input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:14px;height:26px;border:none;border-radius:2px;background:var(--accent)}
input[type=range]:focus-visible{outline:2px solid var(--ice);outline-offset:6px}

.scale{
    display:flex;
    justify-content:space-between;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.16em;
    color:var(--dim);
    margin-top:-4px;
}

.note{
    color:var(--dim);
    font-size:13.5px;
    margin:18px 0 0;
    max-width:34ch;
}

.bar-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    padding-top:14px;
    border-top:1px solid var(--line);
}

.buttons{display:flex;gap:10px;flex-wrap:wrap}

button{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    font-weight:700;
    padding:12px 22px;
    border-radius:2px;
    cursor:pointer;
    transition:transform .18s ease,box-shadow .25s ease;
}

.solid{background:var(--accent);color:var(--void);border:1px solid var(--accent)}
.ghost{background:transparent;color:var(--ice);border:1px solid var(--line);font-weight:400}
.solid:hover{transform:translateY(-2px);box-shadow:0 12px 28px -12px var(--accent)}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible{outline:2px solid var(--ice);outline-offset:3px}

.spirals{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--dim);
}

.spirals b{color:var(--ice);font-weight:600}

/* instructor flash */
.badge{
    position:absolute;
    inset:auto 0 0 0;
    background:var(--accent);
    color:var(--void);
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-weight:700;
    text-align:center;
    padding:12px;
    transform:translateY(100%);
    transition:transform .45s cubic-bezier(.2,.9,.25,1);
    z-index:5;
}

.badge.up{transform:none}

@media (max-width:900px){
    .stage{grid-template-columns:1fr;align-items:start}
    .plate{min-height:240px}
}

@media (prefers-reduced-motion:reduce){
    *{transition:none !important}
}
</style>
</head>

<body>

<div class="bar-top">
    <span>ATHHAM &middot; <b>LIVE</b></span>
    <span>SEEDS PLACED <span class="n" id="count">0</span></span>
</div>

<div class="stage">

    <div class="plate">
        <canvas id="head"></canvas>
    </div>

    <div class="dial">
        <p class="turn"><span id="turn">137.508</span><small>&deg;</small></p>
        <p class="verdict locked" id="verdict">Locked &middot; nothing overlaps</p>

        <input type="range" id="angle" min="130" max="145" step="0.001" value="137.508"
               aria-label="Turn between one seed and the next, in degrees">

        <div class="scale"><span>130&deg;</span><span>145&deg;</span></div>

        <p class="note">Each seed lands one turn further round than the last one.
           Nudge the dial by a tenth of a degree and the whole head falls apart.</p>
    </div>

</div>

<div class="bar-bottom">
    <div class="buttons">
        <button class="solid" id="snap">Snap to 137.5&deg;</button>
        <button class="ghost" id="replant">Replant</button>
    </div>
    <span class="spirals">Arms visible <b id="arms">34 / 55</b></span>
</div>

<div class="badge" id="badge">This panel is inside.html — its own page, its own script</div>

<script>
const GOLDEN=137.507764;

const canvas=document.getElementById("head");
const ctx=canvas.getContext("2d");
const slider=document.getElementById("angle");
const turnOut=document.getElementById("turn");
const verdict=document.getElementById("verdict");
const countOut=document.getElementById("count");
const armsOut=document.getElementById("arms");

const MAX=1500;
let placed=0;
let box=0;

function resize(){
    const plate=canvas.parentElement;
    const side=Math.max(160,Math.min(plate.clientWidth,plate.clientHeight));
    const dpr=window.devicePixelRatio||1;
    box=side;
    canvas.style.width=side+"px";
    canvas.style.height=side+"px";
    canvas.width=Math.round(side*dpr);
    canvas.height=Math.round(side*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
}

function draw(){
    const angle=parseFloat(slider.value)*Math.PI/180;
    const c=box/2;
    const spread=(c-8)/Math.sqrt(MAX);

    ctx.clearRect(0,0,box,box);

    for(let n=1;n<=placed;n++){
        const r=spread*Math.sqrt(n);
        const t=n*angle;
        const x=c+r*Math.cos(t);
        const y=c+r*Math.sin(t);

        const age=n/MAX;
        const size=1.4+age*2.6;
        const hue=32+age*16;
        const light=52+age*16;

        ctx.beginPath();
        ctx.arc(x,y,size,0,Math.PI*2);
        ctx.fillStyle="hsl("+hue+","+(78-age*18)+"%,"+light+"%)";
        ctx.fill();
    }

    countOut.textContent=placed.toLocaleString();
}

function grow(){
    if(placed>=MAX) return;
    placed=Math.min(MAX,placed+20);
    draw();
    requestAnimationFrame(grow);
}

function judge(){
    const v=parseFloat(slider.value);
    turnOut.textContent=v.toFixed(3);

    const off=Math.abs(v-GOLDEN);

    if(off<0.03){
        verdict.textContent="Locked · nothing overlaps";
        verdict.classList.add("locked");
        armsOut.textContent="34 / 55";
    }else if(off<0.6){
        verdict.textContent="Drifting · gaps opening";
        verdict.classList.remove("locked");
        armsOut.textContent="uneven";
    }else{
        verdict.textContent="Broken · seeds stacking in spokes";
        verdict.classList.remove("locked");
        armsOut.textContent="spokes";
    }
}

slider.addEventListener("input",()=>{judge();draw();});

document.getElementById("snap").addEventListener("click",()=>{
    slider.value=GOLDEN.toFixed(3);
    judge();
    draw();
});

document.getElementById("replant").addEventListener("click",()=>{
    placed=0;
    draw();
    grow();
});

window.addEventListener("resize",resize);
if(window.ResizeObserver){
    new ResizeObserver(resize).observe(canvas.parentElement);
}

judge();
resize();
grow();

/* instructor reveal, sent from the page that holds this one */
window.addEventListener("message",e=>{
    document.getElementById("badge").classList.toggle("up",e.data==="xray-on");
});
</script>

</body>
</html>

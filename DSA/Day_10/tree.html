<!DOCTYPE html>
<html>
<head>
<style>
body{
    margin:0;
    background:#000;
    overflow:hidden;
}
canvas{
    display:block;
}
</style>
</head>
<body>

<canvas id="tree"></canvas>

<script>
const canvas = document.getElementById("tree");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

ctx.lineCap = "round";

function fib(n){
    if(n<=1) return 1;
    let a=1,b=1;
    for(let i=2;i<=n;i++){
        [a,b]=[b,a+b];
    }
    return b;
}

function draw(x,y,length,angle,depth){

    if(depth<=0){

        ctx.beginPath();
        ctx.arc(x,y,4,0,Math.PI*2);
        ctx.fillStyle="lime";
        ctx.fill();
        return;
    }

    const x2=x+Math.cos(angle)*length;
    const y2=y+Math.sin(angle)*length;

    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x2,y2);

    ctx.strokeStyle=`rgb(${120-depth*2},70,20)`;
    ctx.lineWidth=Math.max(depth/2,1);
    ctx.stroke();

    const shrink=0.72;

    // Left branch
    draw(
        x2,
        y2,
        length*shrink,
        angle-Math.PI/6,
        depth-1
    );

    // Right branch
    draw(
        x2,
        y2,
        length*shrink,
        angle+Math.PI/6,
        depth-1
    );

    // Fibonacci branch
    if(depth%2===0){

        draw(
            x2,
            y2,
            length*(fib(depth%8)/21),
            angle,
            depth-2
        );
    }
}

draw(
    canvas.width/2,
    canvas.height,
    180,
    -Math.PI/2,
    13
);
</script>

</body>

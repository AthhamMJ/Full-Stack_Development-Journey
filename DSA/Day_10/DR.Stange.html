<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fibonacci Portal</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:black;
}
canvas{
    display:block;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

const cx=canvas.width/2;
const cy=canvas.height/2;

const GOLDEN=Math.PI*(3-Math.sqrt(5));

let particles=[];

class Particle{

    constructor(i){

        this.index=i;

        this.theta=i*GOLDEN;

        this.radius=0;

        this.speed=1+Math.random()*2;

        this.size=1+Math.random()*3;

        this.life=Math.random()*300;

    }

    update(){

        this.life++;

        this.radius+=this.speed;

        this.theta+=0.05;

        if(this.radius>420){

            this.radius=0;

            this.theta=Math.random()*Math.PI*2;

        }

    }

    draw(){

        const wobble=Math.sin(this.life*0.08)*8;

        const r=this.radius+wobble;

        const x=cx+Math.cos(this.theta)*r;
        const y=cy+Math.sin(this.theta)*r;

        const glow=ctx.createRadialGradient(
            x,y,0,
            x,y,this.size*8
        );

        glow.addColorStop(0,"rgba(255,255,220,1)");
        glow.addColorStop(.2,"rgba(255,220,80,.9)");
        glow.addColorStop(.5,"rgba(255,140,0,.7)");
        glow.addColorStop(1,"rgba(255,100,0,0)");

        ctx.fillStyle=glow;

        ctx.beginPath();
        ctx.arc(x,y,this.size*8,0,Math.PI*2);
        ctx.fill();

    }

}

for(let i=0;i<3500;i++)
    particles.push(new Particle(i));

function animate(){

    ctx.fillStyle="rgba(0,0,0,.12)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    particles.sort((a,b)=>a.radius-b.radius);

    particles.forEach(p=>{
        p.update();
        p.draw();
    });

    // Outer glowing ring

    ctx.beginPath();
    ctx.arc(cx,cy,420,0,Math.PI*2);

    ctx.lineWidth=8;

    ctx.strokeStyle="rgba(255,180,40,.25)";
    ctx.shadowBlur=30;
    ctx.shadowColor="orange";
    ctx.stroke();

    requestAnimationFrame(animate);

}

animate();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        padding: 10px;
        margin: 10px;
        font-family: sans-serif;
    }
    body{
        display: flex;
        background-color: rgb(252, 255, 243);
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    h1{
        font-size: 32px;
    }
    .app-window{
        border-radius: 2rem;
        width: 800px;
        height: 500px;
        background: rgba(255, 255, 255, 0.15);

        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }
    .list{
        margin-top: 50px;
        display: flex;
    }
    input, button{
        color: rgba(1, 1, 1, 0.5);
        border-radius: 2rem;
        height: 30px;
        width: 50%;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 1px 12px rgba(0, 0, 0, 0.25);
    }
    button{
        width: 100px;
        height: 50px;
    }
    ul{
        list-style: none;
    }
</style>
<body>
    <h1>Student's<span style="color:green">Task Manager</span></h1>
    <div class="app-window" id="window">
        <input type="text" placeholder="Enter Your Tasks" id="task">
        <button id="add">Add list</button>
        <button type="button">Load Tasks</button>

        <ul id="list">
            
        </ul>
        <script src="app.js"></script>
    </div>
</body>
</html>
